[project]
name = "website-production-studio"
version = "1.0.0"
description = "Persistent website production studio and independently invocable engine"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "python-multipart>=0.0.18", "Pillow>=10,<13", "httpx>=0.27,<1", "playwright>=1.48,<2", "pypdf>=5,<7"]

[project.scripts]
website-engine = "engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]
